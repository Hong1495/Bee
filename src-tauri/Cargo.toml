[package]
name = "bee-vinyl"
version = "0.1.22"
description = "A little space for your records"
authors = ["Bee"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
lofty = "0.22"
rodio = { version = "0.21", features = ["symphonia-aiff", "symphonia-alac"] }
rfd = "0.15"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSImage", "NSToolbar", "NSWindow", "NSBox", "NSColor", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

# Current macOS dyld rejects stripped proc-macro dylibs emitted by this
# toolchain. Keep build-time symbols while retaining optimized app code.
[profile.release.build-override]
strip = false
